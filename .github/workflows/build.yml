name: Build Standalone Binaries

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: passx-windows-amd64.exe
            binary_path: dist/passx.exe
          - os: ubuntu-latest
            artifact_name: passx-linux-amd64
            binary_path: dist/passx

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install . pyinstaller

    - name: Run Test Suite
      run: |
        pip install pytest
        python -m pytest tests/ -v

    - name: Build Standalone Binary with PyInstaller
      run: |
        pyinstaller --onefile --name passx passx/__main__.py

    - name: Rename Artifact
      shell: bash
      run: |
        cp ${{ matrix.binary_path }} ${{ matrix.artifact_name }}

    - name: Upload Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.artifact_name }}
